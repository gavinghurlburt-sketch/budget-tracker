<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Household Budget</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#EFE3CF; --paper:#FFFAF2; --tan:#E3CFAF; --tan-soft:#F6ECDC; --line:#E2D0B3;
  --ink:#4A3B2C; --ink-soft:#7D6A55;
  --orange:#F6B26B; --orange-soft:#FDE6CC; --orange-deep:#A9551A;
  --green:#9FD49A; --green-soft:#E1F2DB; --green-deep:#35713C;
  --head:'Fredoka','Nunito',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 64px}
h1,h2,h3{font-family:var(--head);font-weight:600;margin:0;line-height:1.2}
h1{font-size:clamp(1.8rem,4.5vw,2.5rem);letter-spacing:-.01em}
h2{font-size:1.3rem}
h3{font-size:1.05rem}
small,.muted{color:var(--ink-soft)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green-deep);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.top .hello{margin:4px 0 0;color:var(--ink-soft)}
.top-right{display:flex;gap:10px;align-items:center}
.month-nav{display:flex;align-items:center;gap:4px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px}
.month-nav .label{font-family:var(--head);font-weight:500;min-width:150px;text-align:center}
.icon-btn{border:0;background:transparent;border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:1.1rem;display:grid;place-items:center}
.icon-btn:hover{background:var(--tan-soft)}
.settings-btn{background:var(--paper);border:2px solid var(--line);width:44px;height:44px}

/* summary band */
.band{display:grid;grid-template-columns:1fr 1fr 1.3fr;background:var(--paper);border:2px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:22px}
.band > div{padding:16px 20px}
.band .in{background:var(--green-soft)}
.band .out{background:var(--orange-soft)}
.band .lbl{font-weight:700;font-size:.9rem;color:var(--ink-soft)}
.band .num{font-family:var(--head);font-weight:600;font-size:1.7rem}
.band .net .num.pos{color:var(--green-deep)}
.band .net .num.neg{color:var(--orange-deep)}
.meter{height:10px;border-radius:99px;background:var(--green-soft);margin-top:8px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--orange);border-radius:99px;transition:width .4s}
@media (max-width:640px){.band{grid-template-columns:1fr 1fr}.band .net{grid-column:1/-1}}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:-2px;position:relative;z-index:1}
.tab{border:2px solid transparent;border-bottom:0;background:transparent;padding:10px 18px;border-radius:16px 16px 0 0;cursor:pointer;font-family:var(--head);font-weight:500;font-size:1.02rem;color:var(--ink-soft)}
.tab:hover{background:var(--tan-soft)}
.tab[aria-selected="true"]{background:var(--paper);border-color:var(--line);color:var(--ink)}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:0 22px 22px 22px;padding:22px}
.panel[hidden]{display:none}
.panel-intro{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.panel-intro p{margin:4px 0 0;color:var(--ink-soft);max-width:60ch}

/* cards */
.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px}
.card + .card{margin-top:16px}
.grid-2 > .card,.grid-3 > .card{margin-top:0}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.stack{display:grid;gap:16px}

/* forms */
.quick{background:var(--tan-soft);border-radius:18px;padding:16px;margin-bottom:18px}
.quick h3{margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 140px;min-width:0}
.field.wide{flex:2 1 220px}
.field label{font-size:.85rem;font-weight:700;color:var(--ink-soft)}
.field .hint{font-size:.8rem;color:var(--ink-soft)}
input,select,textarea{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;width:100%}
input:focus,select:focus{border-color:var(--green-deep);outline:none}
.check{display:flex;gap:8px;align-items:center;font-weight:600}
.check input{width:auto}
.btn{border:2px solid transparent;border-radius:999px;padding:9px 18px;font-weight:800;cursor:pointer;background:var(--green);color:var(--ink);white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn.orange{background:var(--orange)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{background:var(--tan-soft)}
.btn.small{padding:5px 12px;font-size:.88rem}
.btn.danger{background:transparent;border-color:#E9B9A0;color:var(--orange-deep)}
.linkish{border:0;background:none;color:var(--ink-soft);cursor:pointer;padding:4px 6px;border-radius:8px;font-size:.9rem}
.linkish:hover{background:var(--tan-soft);color:var(--ink)}

/* people & sources */
.person{border-top:8px solid var(--accent)}
.person-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.person-nums{text-align:right}
.person-nums .big{font-family:var(--head);font-size:1.35rem;font-weight:600;display:block}
ul.list{list-style:none;margin:0 0 12px;padding:0}
ul.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1.5px dashed var(--line)}
ul.list li:last-child{border-bottom:0}
ul.list li.empty{color:var(--ink-soft);justify-content:flex-start;font-style:italic}
.item-main{min-width:0}
.item-name{font-weight:800}
.item-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px;align-items:center}
.item-side{text-align:right;flex-shrink:0}
.item-side .amt{font-weight:800}
.chip{font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--tan-soft);color:var(--ink-soft)}
.chip.green{background:var(--green-soft);color:var(--green-deep)}
.chip.orange{background:var(--orange-soft);color:var(--orange-deep)}
.inactive{opacity:.55}

/* tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th{text-align:left;font-size:.82rem;color:var(--ink-soft);font-weight:800;padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:9px 10px;border-bottom:1.5px dashed var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
.empty-note{padding:18px;text-align:center;color:var(--ink-soft);background:var(--tan-soft);border-radius:14px}

/* category bars */
.bars{display:grid;gap:10px}
.bar-row .bar-top{display:flex;justify-content:space-between;font-size:.92rem;font-weight:700}
.bar-track{height:10px;background:var(--tan-soft);border-radius:99px;overflow:hidden;margin-top:3px}
.bar-track span{display:block;height:100%;background:var(--orange);border-radius:99px}

/* bills */
.bill-status.paid{background:var(--green-soft);border-color:var(--green);color:var(--green-deep)}

/* insights */
.stat .lbl{font-weight:700;color:var(--ink-soft);font-size:.9rem}
.stat .num{font-family:var(--head);font-weight:600;font-size:1.8rem;line-height:1.2}
.stat .note{font-size:.85rem;color:var(--ink-soft)}
.stat.in{background:var(--green-soft);border-color:var(--green)}
.stat.out{background:var(--orange-soft);border-color:var(--orange)}
.gap-card{padding:20px 20px 12px}
.gap-card .chart-box{position:relative;height:340px;margin-top:10px}
.gap-key{display:flex;flex-wrap:wrap;gap:14px;font-size:.88rem;color:var(--ink-soft);margin-top:6px}
.gap-key i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.chart-small{position:relative;height:250px;margin-top:8px}
.chart-small.tall{height:290px}

/* dialog */
dialog{border:2px solid var(--line);border-radius:22px;padding:0;max-width:520px;width:calc(100% - 32px);background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(74,59,44,.35)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 0}
.dlg-body{padding:14px 20px 20px;display:grid;gap:12px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:6px}
.dlg-body p{margin:0}
.divider{border:0;border-top:2px dashed var(--line);margin:6px 0}
.sync-pill{font-size:.8rem;font-weight:700;color:var(--ink-soft);background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 12px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:560px){.panel{padding:16px;border-radius:0 0 18px 18px}.tab{padding:8px 12px;font-size:.95rem}.month-nav .label{min-width:120px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="title">Our household budget</h1>
      <p class="hello" id="hello"></p>
    </div>
    <div class="top-right">
      <div class="month-nav" aria-label="Choose month">
        <button class="icon-btn" data-action="prev-month" aria-label="Previous month">‹</button>
        <span class="label" id="month-label"></span>
        <button class="icon-btn" data-action="next-month" aria-label="Next month">›</button>
      </div>
      <span class="sync-pill" id="sync-pill" hidden></span>
      <button class="icon-btn settings-btn" data-action="open-settings" aria-label="Settings">⚙️</button>
    </div>
  </header>

  <section class="band" id="band" aria-live="polite"></section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="income">💵 Income</button>
    <button class="tab" role="tab" data-tab="expenses">🛒 Expenses</button>
    <button class="tab" role="tab" data-tab="bills">🧾 Bills</button>
    <button class="tab" role="tab" data-tab="insights">📈 Charts &amp; data</button>
  </nav>

  <main>
    <section class="panel" id="panel-income" role="tabpanel"></section>
    <section class="panel" id="panel-expenses" role="tabpanel" hidden></section>
    <section class="panel" id="panel-bills" role="tabpanel" hidden></section>
    <section class="panel" id="panel-insights" role="tabpanel" hidden></section>
  </main>
</div>

<dialog id="dlg"><form id="dlg-form" novalidate></form></dialog>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status"></div>

<script>
/* =========================================================
   Data layer
   Store = this browser's copy (always kept, works offline).
   Cloud = Supabase sync: both people sign in, share one
   household, and each edit is pushed and mirrored live.
   Leave SUPABASE_URL blank to run purely on this device.
   ========================================================= */
const SUPABASE_URL = 'https://vthqrbzaqhrfcuembkvz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_RAi9_WMd5uIPutL3H5cgkg_ImuNj0UG'; // publishable key: safe in the page, row security protects data
const STORAGE_KEY = 'household-budget-v1';
const SKIP_KEY = 'household-budget-skip-signin';
const Store = {
  load(){ try{ const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } },
  save(data){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); return true; }catch(e){ return false; } }
};
const Cloud = {
  client:null, user:null, householdId:null, channel:null,
  enabled(){ return !!(SUPABASE_URL && SUPABASE_KEY && window.supabase); },
  init(){ if(!this.enabled()) return false; this.client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); return true; },
  async session(){ const { data } = await this.client.auth.getSession(); this.user = data.session ? data.session.user : null; return this.user; },
  async signIn(email, password){ const { error } = await this.client.auth.signInWithPassword({ email, password }); if(error) throw error; return this.session(); },
  async signUp(email, password){ const { data, error } = await this.client.auth.signUp({ email, password }); if(error) throw error; if(!data.session) return null; return this.session(); },
  async signOut(){ await this.client.auth.signOut(); this.user = null; this.householdId = null; },
  async findHousehold(){ const { data, error } = await this.client.from('budget_members').select('household_id').eq('user_id', this.user.id).limit(1); if(error) throw error; this.householdId = data.length ? data[0].household_id : null; return this.householdId; },
  async createHousehold(initial){
    const id = uid();
    let r = await this.client.from('budget_households').insert({ id, name:'Our household', data:initial, updated_by:this.user.id }); if(r.error) throw r.error;
    r = await this.client.from('budget_members').insert({ household_id:id, user_id:this.user.id }); if(r.error) throw r.error;
    this.householdId = id;
  },
  async joinHousehold(code){ const { error } = await this.client.from('budget_members').insert({ household_id:code, user_id:this.user.id }); if(error) throw error; this.householdId = code; },
  async load(){ const { data, error } = await this.client.from('budget_households').select('data').eq('id', this.householdId).single(); if(error) throw error; return data.data; },
  async save(state){ const { error } = await this.client.from('budget_households').update({ data:state, updated_by:this.user.id }).eq('id', this.householdId); if(error) throw error; },
  subscribe(onChange){
    if(this.channel) this.client.removeChannel(this.channel);
    this.channel = this.client.channel('budget-' + this.householdId)
      .on('postgres_changes', { event:'UPDATE', schema:'public', table:'budget_households', filter:'id=eq.' + this.householdId },
        payload => { if(payload.new && payload.new.updated_by !== this.user.id) onChange(payload.new.data); })
      .subscribe();
  }
};

const DEFAULT_EXPENSE_CATS = ['Groceries','Dining out','Gas & transport','Household','Health','Pets','Entertainment','Shopping','Gifts','Work & business costs','Other'];
const DEFAULT_BILL_CATS = ['Housing','Utilities','Phone & internet','Insurance','Subscriptions','Loans & debt','Car','Other'];
const TYPES = { job:'Job', side:'Side job', freelance:'Freelance', hobby:'Hobby' };
const FREQ = { weekly:'Weekly', biweekly:'Every 2 weeks', monthly:'Monthly', quarterly:'Every 3 months', yearly:'Yearly' };
const FREQ_FACTOR = { weekly:52/12, biweekly:26/12, monthly:1, quarterly:1/3, yearly:1/12 };
const PERSON_COLORS = ['#6DB768','#C49A64'];
const SHARED_COLOR = '#E6D3B3';

function defaultState(){
  return {
    version:1, onboarded:false,
    people:[{id:'p1',name:'Person 1'},{id:'p2',name:'Person 2'}],
    sources:[], income:[], expenses:[], bills:[],
    expenseCategories:[...DEFAULT_EXPENSE_CATS], billCategories:[...DEFAULT_BILL_CATS]
  };
}
function normalize(d){
  const base = defaultState();
  const s = Object.assign(base, d || {});
  ['sources','income','expenses','bills'].forEach(k => { if(!Array.isArray(s[k])) s[k] = []; });
  if(!Array.isArray(s.people) || s.people.length < 2) s.people = base.people;
  if(!Array.isArray(s.expenseCategories) || !s.expenseCategories.length) s.expenseCategories = [...DEFAULT_EXPENSE_CATS];
  if(!Array.isArray(s.billCategories) || !s.billCategories.length) s.billCategories = [...DEFAULT_BILL_CATS];
  return s;
}

let S = normalize(Store.load());
const view = { tab:'income', month:null };

/* ---------- helpers ---------- */
const $ = sel => document.querySelector(sel);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now().toString(36));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:(Math.round((n||0)*100)%100)?2:0,maximumFractionDigits:2}).format(n||0);
const money0 = n => new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Math.round(n||0));
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const ymOf = date => String(date).slice(0,7);
const CUR = ymOf(todayStr());
view.month = CUR;
function addMonths(ym, n){ let [y,m] = ym.split('-').map(Number); m += n; y += Math.floor((m-1)/12); m = ((m-1)%12+12)%12+1; return `${y}-${pad(m)}`; }
function monthLabel(ym, short){ return new Date(ym + '-15T12:00:00').toLocaleDateString('en-US', short ? {month:'short', year:'2-digit'} : {month:'long', year:'numeric'}); }
function monthName(ym){ return new Date(ym + '-15T12:00:00').toLocaleDateString('en-US',{month:'long'}); }
function prettyDate(d){ return new Date(d + 'T12:00:00').toLocaleDateString('en-US',{month:'short', day:'numeric'}); }
function daysIn(ym){ const [y,m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function defaultDateFor(ym){ return ym === CUR ? todayStr() : `${ym}-01`; }
function personName(id){ if(id === 'shared') return 'Shared'; const p = S.people.find(p => p.id === id); return p ? p.name : 'Unknown'; }
function personColor(id){ if(id === 'shared') return SHARED_COLOR; const i = S.people.findIndex(p => p.id === id); return PERSON_COLORS[i] || SHARED_COLOR; }
const sum = arr => arr.reduce((a,b) => a + (+b || 0), 0);
const num = v => { const n = parseFloat(String(v).replace(/[$,\s]/g,'')); return isFinite(n) ? Math.round(n*100)/100 : NaN; };

/* ---------- math ---------- */
const FULL_MONTHS = [1,2,3].map(i => addMonths(CUR, -i)); // last 3 complete months
const monthIncome = ym => sum(S.income.filter(e => ymOf(e.date) === ym).map(e => e.amount));
const monthExpenses = ym => sum(S.expenses.filter(e => ymOf(e.date) === ym).map(e => e.amount));
const sourceMonth = (sid, ym) => sum(S.income.filter(e => e.sourceId === sid && ymOf(e.date) === ym).map(e => e.amount));
const personMonth = (pid, ym) => { const ids = new Set(S.sources.filter(s => s.personId === pid).map(s => s.id)); return sum(S.income.filter(e => ids.has(e.sourceId) && ymOf(e.date) === ym).map(e => e.amount)); };

function sourceAverage(src){
  const entries = S.income.filter(e => e.sourceId === src.id);
  if(!entries.length) return null;
  const first = entries.map(e => ymOf(e.date)).sort()[0];
  const months = FULL_MONTHS.filter(m => m >= first);
  if(!months.length) return null;
  return sum(months.map(m => sourceMonth(src.id, m))) / months.length;
}
function projectSource(src){
  if(src.active === false) return 0;
  if(src.kind === 'fixed') return +src.expected || 0;
  const avg = sourceAverage(src);
  return avg == null ? (+src.expected || 0) : avg;
}
const projectedIncome = () => sum(S.sources.map(projectSource));
const projectedPerson = pid => sum(S.sources.filter(s => s.personId === pid).map(projectSource));
const billMonthly = b => (+b.amount || 0) * (FREQ_FACTOR[b.frequency] || 1);
const projectedBills = () => sum(S.bills.filter(b => b.active !== false).map(billMonthly));
function averageEverydaySpending(){
  const list = S.expenses.filter(e => !e.billId);
  if(!list.length) return 0;
  const first = list.map(e => ymOf(e.date)).sort()[0];
  const months = FULL_MONTHS.filter(m => m >= first);
  if(!months.length) return sum(list.filter(e => ymOf(e.date) === CUR).map(e => e.amount));
  return sum(months.map(m => sum(list.filter(e => ymOf(e.date) === m).map(e => e.amount)))) / months.length;
}
const projectedSpending = () => projectedBills() + averageEverydaySpending();
const billPayment = (billId, ym) => S.expenses.find(e => e.billId === billId && ymOf(e.date) === ym);

/* ---------- persistence ---------- */
let syncTimer = null;
function commit(msg){
  if(!Store.save(S)) toast('Could not save. Your browser storage may be full or blocked.');
  else if(msg) toast(msg);
  renderAll();
  if(Cloud.householdId){
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => Cloud.save(S).then(() => setSyncPill('Synced')).catch(e => { setSyncPill('Not synced'); toast('Couldn’t sync: ' + e.message); }), 400);
    setSyncPill('Saving…');
  }
}
function setSyncPill(text){ const el = $('#sync-pill'); if(!text){ el.hidden = true; return; } el.hidden = false; el.textContent = text; }
let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }

/* =========================================================
   Rendering
   ========================================================= */
function renderAll(){
  $('#month-label').textContent = monthLabel(view.month);
  const [a,b] = S.people;
  $('#hello').textContent = `${a.name} & ${b.name}'s money, all in one place`;
  renderBand();
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === view.tab)));
  document.querySelectorAll('.panel').forEach(p => p.hidden = p.id !== 'panel-' + view.tab);

}

function renderBand(){
  const m = view.month, inc = monthIncome(m), out = monthExpenses(m), net = inc - out;
  const pct = inc > 0 ? Math.min(100, out / inc * 100) : (out > 0 ? 100 : 0);
  const soFar = m === CUR ? ' so far' : '';
  $('#band').innerHTML = `
    <div class="in"><div class="lbl">Came in${soFar}</div><div class="num">${money0(inc)}</div></div>
    <div class="out"><div class="lbl">Went out${soFar}</div><div class="num">${money0(out)}</div></div>
    <div class="net"><div class="lbl">${net >= 0 ? 'Left over' : 'Over by'} in ${monthName(m)}</div>
      <div class="num ${net >= 0 ? 'pos' : 'neg'}">${money0(Math.abs(net))}</div>
      <div class="meter" title="Spending as a share of income"><span style="width:${pct}%"></span></div>
      <small>${inc > 0 ? `${Math.round(out/inc*100)}% of income spent` : 'Log some income to see how much is spent'}</small>

}

/* ---------- Insights tab ---------- */
let charts = [];
function destroyCharts(){ charts.forEach(c => c.destroy()); charts = []; }
function renderInsights(){
  const el = $('#panel-insights');
  destroyCharts();
  const pInc = projectedIncome(), pOut = projectedSpending(), gap = pInc - pOut;
  const rate = pInc > 0 ? Math.round(gap / pInc * 100) : null;
  const hasData = S.income.length || S.expenses.length;

  const srcRows = S.people.flatMap(p => S.sources.filter(s => s.personId === p.id).map(s => {
    const avg = sourceAverage(s);
    return `<tr class="${s.active === false ? 'inactive' : ''}"><td>${esc(p.name)}</td><td><b>${esc(s.name)}</b></td><td>${TYPES[s.type]}</td><td>${s.kind === 'fixed' ? 'Steady' : 'Varies'}</td>
      <td class="num">${s.expected ? money0(s.expected) : '—'}</td><td class="num">${avg == null ? '—' : money0(avg)}</td><td class="num"><b>${money0(projectSource(s))}</b></td></tr>`;
  })).join('');

  el.innerHTML = `
    <div class="panel-intro"><div><h2>Charts &amp; data</h2><p>A look ahead based on your steady income, your recent averages for income that varies, your bills, and your usual everyday spending.</p></div></div>
    <div class="grid-3" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
      <div class="card stat in"><div class="lbl">Expected income</div><div class="num">${money0(pInc)}</div><div class="note">per month, both of you</div></div>
      <div class="card stat out"><div class="lbl">Expected spending</div><div class="num">${money0(pOut)}</div><div class="note">${money0(projectedBills())} bills + ${money0(averageEverydaySpending())} everyday</div></div>
      <div class="card stat"><div class="lbl">Monthly gap</div><div class="num" style="color:${gap >= 0 ? 'var(--green-deep)' : 'var(--orange-deep)'}">${gap >= 0 ? '+' : '−'}${money0(Math.abs(gap))}</div><div class="note">${gap >= 0 ? 'left over each month' : 'short each month'}</div></div>
      <div class="card stat"><div class="lbl">Savings rate</div><div class="num">${rate == null ? '—' : rate + '%'}</div><div class="note">of income left after spending</div></div>
    </div>

    <div class="card gap-card" style="margin-top:16px">
      <h3>Income vs. spending</h3>
      ${hasData ? `<div class="chart-box"><canvas id="ch-gap" aria-label="Line chart of income versus spending by month"></canvas></div>
      <div class="gap-key"><span><i style="background:rgba(159,212,154,.7)"></i>Money left over</span><span><i style="background:rgba(246,178,107,.7)"></i>Spent more than came in</span><span>Dashed lines are the forecast</span></div>`
      : `<div class="empty-note" style="margin-top:10px">Log some income and expenses and this chart will show the gap between them, month by month.</div>`}
    </div>

    <div class="grid-3" style="margin-top:16px">
      <div class="card"><h3>Who brings in what</h3><div class="chart-small"><canvas id="ch-person"></canvas></div></div>
      <div class="card"><h3>Income by kind of work</h3><div class="chart-small"><canvas id="ch-type"></canvas></div></div>
      <div class="card"><h3>Spending by category</h3><small>Last 3 months</small><div class="chart-small tall"><canvas id="ch-cat"></canvas></div></div>
    </div>

    <div class="card" style="margin-top:16px"><h3 style="margin-bottom:8px">Every income source</h3>
      ${srcRows ? `<div class="table-wrap"><table><thead><tr><th>Who</th><th>Source</th><th>Kind</th><th>Pay</th><th class="num">Your estimate</th><th class="num">3-month avg</th><th class="num">Forecast / mo</th></tr></thead><tbody>${srcRows}</tbody></table></div>` : '<div class="empty-note">Add income sources on the Income tab.</div>'}
    </div>`;

  if(view.tab === 'insights') requestAnimationFrame(drawCharts);
}

function drawCharts(){
  if(typeof Chart === 'undefined'){ toast('Charts could not load. Check your internet connection.'); return; }
  destroyCharts();
  Chart.defaults.font.family = 'Nunito, system-ui, sans-serif';
  Chart.defaults.color = '#7D6A55';
  const tooltip = { callbacks:{ label: c => `${c.dataset.label || c.label}: ${money0(c.parsed.y ?? c.parsed.x ?? c.parsed)}` } };

  // gap chart
  const gapCanvas = $('#ch-gap');
  if(gapCanvas){
    let months = []; for(let i = -11; i <= 3; i++) months.push(addMonths(CUR, i));
    const allDates = [...S.income, ...S.expenses].map(e => ymOf(e.date)).sort();
    const firstData = allDates[0];
    if(firstData){ const idx = months.findIndex(m => m >= firstData); if(idx > 0) months = months.slice(Math.min(idx, months.indexOf(CUR) - 1)); }
    const ci = months.indexOf(CUR);
    const incA = months.map((m,i) => i <= ci ? monthIncome(m) : null);
    const expA = months.map((m,i) => i <= ci ? monthExpenses(m) : null);
    const pInc = projectedIncome(), pExp = projectedSpending();
    const startP = Math.max(0, ci - 1);
    const incP = months.map((m,i) => i < startP ? null : (i === startP && startP < ci) ? incA[startP] : (i >= ci ? pInc : null));
    const expP = months.map((m,i) => i < startP ? null : (i === startP && startP < ci) ? expA[startP] : (i >= ci ? pExp : null));
    const labels = months.map(m => m === CUR ? monthLabel(m, true) + ' (so far)' : monthLabel(m, true));
    const fillGap = (target, alpha) => ({ target, above:`rgba(159,212,154,${alpha})`, below:`rgba(246,178,107,${alpha})` });
    charts.push(new Chart(gapCanvas, {
      type:'line',
      data:{ labels, datasets:[
        { label:'Income', data:incA, borderColor:'#4E9A55', backgroundColor:'#4E9A55', borderWidth:3, tension:.3, pointRadius:3, fill:fillGap(1,.45) },
        { label:'Spending', data:expA, borderColor:'#E0852F', backgroundColor:'#E0852F', borderWidth:3, tension:.3, pointRadius:3, fill:false },
        { label:'Income forecast', data:incP, borderColor:'#4E9A55', backgroundColor:'#4E9A55', borderDash:[7,6], borderWidth:2.5, tension:.3, pointRadius:2, fill:fillGap(3,.2) },
        { label:'Spending forecast', data:expP, borderColor:'#E0852F', backgroundColor:'#E0852F', borderDash:[7,6], borderWidth:2.5, tension:.3, pointRadius:2, fill:false }
      ]},
      options:{ maintainAspectRatio:false, interaction:{mode:'index', intersect:false},
        plugins:{ legend:{display:false},
          tooltip:{ filter: it => it.parsed.y != null && !(it.datasetIndex >= 2 && it.dataIndex <= ci - 1) && !(it.datasetIndex < 2 && it.dataIndex > ci),
            callbacks:{ label: c => `${c.dataset.label}: ${money0(c.parsed.y)}`,
              footer: items => { const i = items.find(x => x.datasetIndex % 2 === 0), o = items.find(x => x.datasetIndex % 2 === 1); if(!i || !o) return ''; const g = i.parsed.y - o.parsed.y; return (g >= 0 ? 'Left over: ' : 'Short by: ') + money0(Math.abs(g)); } } } },
        scales:{ y:{ beginAtZero:true, grid:{color:'#EFE3CF'}, ticks:{ callback: v => money0(v) } }, x:{ grid:{display:false} } } }
    }));
  }

  // by person
  const pc = $('#ch-person');
  if(pc){
    const vals = S.people.map(p => Math.round(projectedPerson(p.id)));
    if(sum(vals) > 0) charts.push(new Chart(pc, { type:'doughnut',
      data:{ labels:S.people.map(p => p.name), datasets:[{ data:vals, backgroundColor:S.people.map(p => personColor(p.id)), borderColor:'#fff', borderWidth:3 }] },
      options:{ maintainAspectRatio:false, cutout:'62%', plugins:{ legend:{position:'bottom'}, tooltip:{ callbacks:{ label: c => `${c.label}: ${money0(c.parsed)}/mo` } } } } }));
    else pc.parentElement.innerHTML = '<div class="empty-note">No income forecast yet.</div>';
  }

  // by type
  const tc = $('#ch-type');
  if(tc){
    const keys = Object.keys(TYPES);
    const datasets = S.people.map(p => ({ label:p.name, backgroundColor:personColor(p.id), borderRadius:8,
      data:keys.map(k => Math.round(sum(S.sources.filter(s => s.personId === p.id && s.type === k).map(projectSource)))) }));
    if(sum(datasets.flatMap(d => d.data)) > 0) charts.push(new Chart(tc, { type:'bar',
      data:{ labels:keys.map(k => TYPES[k]), datasets },
      options:{ maintainAspectRatio:false, plugins:{ legend:{position:'bottom'}, tooltip:{ callbacks:{ label: c => `${c.dataset.label}: ${money0(c.parsed.y)}/mo` } } },
        scales:{ x:{stacked:true, grid:{display:false}}, y:{stacked:true, beginAtZero:true, grid:{color:'#EFE3CF'}, ticks:{callback: v => money0(v)}} } } }));
    else tc.parentElement.innerHTML = '<div class="empty-note">No income forecast yet.</div>';
  }

  // by category (last 3 full months, else this month)
  const cc = $('#ch-cat');
  if(cc){
    let pool = S.expenses.filter(e => FULL_MONTHS.includes(ymOf(e.date)));
    if(!pool.length) pool = S.expenses.filter(e => ymOf(e.date) === CUR);
    const by = {}; pool.forEach(e => by[e.category] = (by[e.category] || 0) + e.amount);
    let entries = Object.entries(by).sort((a,b) => b[1] - a[1]);
    if(entries.length > 6){ const rest = sum(entries.slice(5).map(e => e[1])); entries = [...entries.slice(0,5), ['Everything else', rest]]; }
    const palette = ['#F6B26B','#9FD49A','#D9B98C','#F9CF9E','#7FBF7A','#E8955A','#C7DDB5','#B8946A','#FBE0BF','#A7C98F','#E5C9A3'];
    if(entries.length) charts.push(new Chart(cc, { type:'doughnut',
      data:{ labels:entries.map(e => e[0]), datasets:[{ data:entries.map(e => Math.round(e[1])), backgroundColor:entries.map((e,i) => palette[i % palette.length]), borderColor:'#fff', borderWidth:3 }] },
      options:{ maintainAspectRatio:false, cutout:'55%', plugins:{ legend:{position:'bottom', labels:{boxWidth:12}}, tooltip:{ callbacks:{ label: c => `${c.label}: ${money0(c.parsed)}` } } } } }));
    else cc.parentElement.innerHTML = '<div class="empty-note">No spending logged yet.</div>';
  }
}

const dlg = $('#dlg'), dlgForm = $('#dlg-form');
let dlgSubmit = null;
function openDialog(title, body, onSubmit){
  dlgSubmit = onSubmit;
  dlgForm.innerHTML = `<div class="dlg-head"><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-action="close-dialog" aria-label="Close">✕</button></div><div class="dlg-body">${body}</div>`;
  dlg.showModal();
  const first = dlgForm.querySelector('input:not([type=hidden]),select');
  if(first) first.focus();
}
function closeDialog(){ dlg.close(); dlgSubmit = null; }
dlgForm.addEventListener('submit', e => {
  e.preventDefault();
  if(!dlgSubmit) return closeDialog();
  const ok = dlgSubmit(new FormData(dlgForm), e.submitter);
  if(ok !== false) closeDialog();
});

    <div class="row">
      <div class="field"><label>Kind of work</label><select name="type">${Object.entries(TYPES).map(([k,v]) => `<option value="${k}" ${k === s.type ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label>Pay</label><select name="kind"><option value="fixed" ${s.kind === 'fixed' ? 'selected' : ''}>Steady</option><option value="variable" ${s.kind === 'variable' ? 'selected' : ''}>Varies month to month</option></select></div>
    </div>
    <div class="field"><label>About how much per month?</label><input name="expected" inputmode="decimal" value="${s.expected || ''}" placeholder="$0">
      <span class="hint">Steady pay uses this number. If pay varies, this is only a starting guess until you have a few months logged.</span></div>
    <label class="check"><input type="checkbox" name="active" ${s.active !== false ? 'checked' : ''}> Currently bringing in money</label>
    <div class="dlg-actions">
      ${src ? '<button type="button" class="btn danger" data-action="delete-source" data-id="' + src.id + '">Delete</button>' : ''}
      <button type="button" class="btn ghost" data-action="close-dialog">Cancel</button>
      <button type="submit" class="btn">${src ? 'Save changes' : 'Add source'}</button>
    </div>`, fd => {
      const name = String(fd.get('name') || '').trim();
      if(!name){ toast('Give this source a name.'); return false; }
      const expected = fd.get('expected') ? num(fd.get('expected')) : 0;
      if(isNaN(expected)){ toast('Enter the monthly amount as a number.'); return false; }
      const data = { personId:fd.get('personId'), name, type:fd.get('type'), kind:fd.get('kind'), expected, active:fd.get('active') === 'on' };
      if(src) Object.assign(src, data); else S.sources.push({ id:uid(), createdAt:todayStr(), ...data });
      commit(src ? 'Source updated' : 'Source added');
    });
}

function billDialog(bill){
  const b = bill || { frequency:'monthly', category:S.billCategories[0], personId:'shared', active:true };
  openDialog(bill ? 'Edit bill' : 'Add a bill', `
    <div class="field"><label>Name</label><input name="name" value="${esc(b.name || '')}" placeholder="e.g. Rent, Electric, Spotify" required></div>
    <div class="row">
      <div class="field"><label>Amount</label><input name="amount" inputmode="decimal" value="${b.amount ?? ''}" placeholder="$0.00" required></div>
      <div class="field"><label>How often</label><select name="frequency">${Object.entries(FREQ).map(([k,v]) => `<option value="${k}" ${k === b.frequency ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
    </div>
    <div class="row">
      <div class="field"><label>Category</label><select name="category">${catOptions(S.billCategories, b.category)}</select></div>
      <div class="field"><label>Due day of month</label><input name="dueDay" type="number" min="1" max="31" value="${b.dueDay || ''}" placeholder="1–31"></div>
      <div class="field"><label>Who pays</label><select name="personId">${whoOptions(b.personId)}</select></div>
    </div>
    <label class="check"><input type="checkbox" name="active" ${b.active !== false ? 'checked' : ''}> Still paying this</label>
    <div class="dlg-actions">
      ${bill ? '<button type="button" class="btn danger" data-action="delete-bill" data-id="' + bill.id + '">Delete</button>' : ''}
      <button type="button" class="btn ghost" data-action="close-dialog">Cancel</button>
      <button type="submit" class="btn orange">${bill ? 'Save changes' : 'Add bill'}</button>
    </div>`, fd => {
      const name = String(fd.get('name') || '').trim(), amount = num(fd.get('amount'));
      if(!name){ toast('Give this bill a name.'); return false; }
      if(isNaN(amount) || amount <= 0){ toast('Enter the bill amount as a number.'); return false; }
      const dd = parseInt(fd.get('dueDay'), 10);
      const data = { name, amount, frequency:fd.get('frequency'), category:fd.get('category'), dueDay:(dd >= 1 && dd <= 31) ? dd : null, personId:fd.get('personId'), active:fd.get('active') === 'on' };
      if(bill) Object.assign(bill, data); else S.bills.push({ id:uid(), ...data });
      commit(bill ? 'Bill updated' : 'Bill added');
    });
}

function settingsDialog(firstRun){
  const [a,b] = S.people;
  openDialog(firstRun ? 'Welcome! Who’s budgeting?' : 'Settings', `
    ${firstRun ? '<p class="muted">Add both of your names. You can change them later in settings.</p>' : ''}
    <div class="row">
      <div class="field"><label>First person</label><input name="p1" value="${esc(a.name === 'Person 1' ? '' : a.name)}" placeholder="Name"></div>
      <div class="field"><label>Second person</label><input name="p2" value="${esc(b.name === 'Person 2' ? '' : b.name)}" placeholder="Name"></div>
    </div>
    <div class="dlg-actions"><button type="submit" class="btn" name="go" value="save">${firstRun ? 'Get started' : 'Save names'}</button></div>
    <hr class="divider">
    <div><h3>Try it out</h3><p class="muted" style="margin:4px 0 8px">Fill the app with made-up data to see how the charts work. This replaces everything except your names.</p>
      <button type="submit" class="btn ghost small" name="go" value="sample">Load sample data</button></div>
    ${firstRun ? '' : `
    <hr class="divider">
    <div><h3>Sync between your phones</h3>${accountSection()}</div>
    <hr class="divider">
    <div><h3>Backup</h3><p class="muted" style="margin:4px 0 8px">${Cloud.householdId ? 'Your budget is synced online, but a backup file is still a good idea now and then.' : 'Your data is saved in this browser only. Download a backup file now and then, especially before clearing browser data.'}</p>
      <div class="row" style="gap:8px"><button type="button" class="btn ghost small" data-action="export">Download backup</button><button type="button" class="btn ghost small" data-action="import">Restore from backup</button><button type="button" class="btn danger small" data-action="reset">Erase everything</button></div></div>`}`,
    (fd, submitter) => {
      const n1 = String(fd.get('p1') || '').trim(), n2 = String(fd.get('p2') || '').trim();
      if(n1) S.people[0].name = n1;
      if(n2) S.people[1].name = n2;
      S.onboarded = true;
      if(submitter && submitter.value === 'sample'){
        if(!firstRun && (S.income.length || S.expenses.length || S.bills.length || S.sources.length) && !confirm('Replace your current data with sample data?')) return false;
        loadSample(); commit('Sample data loaded'); return;
      }
      commit('Saved');
    });
}

function accountSection(){
  if(!Cloud.enabled()) return '<p class="muted" style="margin:4px 0 0">Sync isn’t set up in this copy of the app. Data stays in this browser.</p>';
  if(!Cloud.user) return `<p class="muted" style="margin:4px 0 8px">Sign in with your shared login and this device joins the same budget. Whatever is on this device comes along.</p><button type="button" class="btn small" data-action="sign-in">Sign in</button>`;
  return `<p class="muted" style="margin:4px 0 8px">Signed in as <b>${esc(Cloud.user.email)}</b>. Sign in with the same email and password on the other phone and you’ll both see the same budget.</p>
    <button type="button" class="btn ghost small" data-action="sign-out">Sign out</button>`;
}

function signInDialog(){
  const local = S.income.length || S.expenses.length || S.bills.length || S.sources.length;
  openDialog('Sign in to sync', `
    <p class="muted">One shared login for the two of you. Sign in on both phones and you see the same budget, live.${local ? ' The data already on this device comes along.' : ''}</p>
    <div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required></div>
    <div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" minlength="6" required><span class="hint">At least 6 characters.</span></div>
    <div class="dlg-actions">
      <button type="submit" class="btn ghost" name="go" value="local">Skip, use this device only</button>
      <button type="submit" class="btn ghost" name="go" value="signup">Create the login</button>
      <button type="submit" class="btn" name="go" value="signin">Sign in</button>
    </div>`, (fd, submitter) => {
      const go = submitter ? submitter.value : 'signin';
      if(go === 'local'){ try{ localStorage.setItem(SKIP_KEY, '1'); }catch(e){} if(!S.onboarded) setTimeout(() => settingsDialog(true), 50); return; }
      const email = String(fd.get('email') || '').trim(), password = String(fd.get('password') || '');
      if(!email || password.length < 6){ toast('Enter your email and a password of at least 6 characters.'); return false; }
      const btns = dlgForm.querySelectorAll('button'); btns.forEach(b => b.disabled = true);
      (go === 'signup' ? Cloud.signUp(email, password) : Cloud.signIn(email, password)).then(user => {
        if(!user){ closeDialog(); toast('Check your email to confirm the login, then sign in.'); return; }
        try{ localStorage.removeItem(SKIP_KEY); }catch(e){}
        closeDialog(); return connectHousehold();
      }).catch(e => { btns.forEach(b => b.disabled = false); toast(e.message || 'Sign-in failed.'); });
      return false;
    });
}

async function connectHousehold(){
  const h = await Cloud.findHousehold();
  if(!h){ await Cloud.createHousehold(S); } // first sign-in: whatever is on this device becomes the shared budget
  const data = await Cloud.load();
  S = normalize(data); Store.save(S); renderAll();
  setSyncPill('Synced');
  Cloud.subscribe(d => { S = normalize(d); Store.save(S); renderAll(); toast('Updated from the other phone'); });
  if(!S.onboarded) settingsDialog(true);
}

function categoriesDialog(){
  openDialog('Edit categories', `
    <div class="field"><label>Expense categories, one per line</label><textarea name="exp" rows="8">${esc(S.expenseCategories.join('\n'))}</textarea></div>
    <div class="field"><label>Bill categories, one per line</label><textarea name="bill" rows="6">${esc(S.billCategories.join('\n'))}</textarea>
      <span class="hint">Removing a category won't change entries you've already logged.</span></div>
    <div class="dlg-actions"><button type="button" class="btn ghost" data-action="close-dialog">Cancel</button><button type="submit" class="btn">Save categories</button></div>`,
    fd => {
      const clean = v => [...new Set(String(v || '').split('\n').map(x => x.trim()).filter(Boolean))];
      const e = clean(fd.get('exp')), b = clean(fd.get('bill'));
      if(!e.length || !b.length){ toast('Keep at least one category in each list.'); return false; }
      S.expenseCategories = e; S.billCategories = b; commit('Categories saved');
    });
}

/* =========================================================
   Sample data
   ========================================================= */
function loadSample(){
  const [p1, p2] = S.people.map(p => p.id);
  const rnd = (a,b) => Math.round((a + Math.random() * (b - a)) * 100) / 100;
  const today = new Date().getDate();
  const src = [
    { id:uid(), personId:p1, name:'Main job', type:'job', kind:'fixed', expected:3200, active:true },
    { id:uid(), personId:p1, name:'Lessons', type:'side', kind:'variable', expected:800, active:true },
    { id:uid(), personId:p1, name:'Freelance gigs', type:'freelance', kind:'variable', expected:600, active:true },
    { id:uid(), personId:p2, name:'Day job', type:'job', kind:'fixed', expected:2900, active:true },
    { id:uid(), personId:p2, name:'Weekend shifts', type:'side', kind:'variable', expected:450, active:true },
    { id:uid(), personId:p2, name:'Craft sales', type:'hobby', kind:'variable', expected:150, active:true }
  ];
  const bills = [
    { id:uid(), name:'Rent', amount:1650, frequency:'monthly', category:'Housing', dueDay:1, personId:'shared', active:true },
    { id:uid(), name:'Electric', amount:125, frequency:'monthly', category:'Utilities', dueDay:12, personId:p1, active:true },
    { id:uid(), name:'Internet', amount:70, frequency:'monthly', category:'Phone & internet', dueDay:20, personId:p2, active:true },
    { id:uid(), name:'Phones', amount:95, frequency:'monthly', category:'Phone & internet', dueDay:8, personId:'shared', active:true },
    { id:uid(), name:'Car insurance', amount:160, frequency:'monthly', category:'Insurance', dueDay:15, personId:p2, active:true },
    { id:uid(), name:'Streaming', amount:28, frequency:'monthly', category:'Subscriptions', dueDay:5, personId:'shared', active:true },
    { id:uid(), name:'Car payment', amount:340, frequency:'monthly', category:'Car', dueDay:22, personId:p1, active:true }
  ];
  const income = [], expenses = [];
  for(let back = 7; back >= 0; back--){
    const ym = addMonths(CUR, -back), last = back === 0 ? today : daysIn(ym);
    const d = day => `${ym}-${pad(Math.min(day, daysIn(ym)))}`;
    const add = (s, day, amt, note) => { if(day <= last) income.push({ id:uid(), sourceId:s.id, date:d(day), amount:amt, note }); };
    add(src[0], 1, 1600, 'Paycheck'); add(src[0], 15, 1600, 'Paycheck');
    add(src[3], 5, 1450, 'Paycheck'); add(src[3], 19, 1450, 'Paycheck');
    for(let w = 0; w < 4; w++) add(src[1], 3 + w*7, rnd(140, 260), 'Lessons this week');
    const gigs = Math.floor(rnd(0, 3)); for(let g = 0; g < gigs; g++) add(src[2], 6 + g*9, rnd(250, 700), 'Gig');
    add(src[4], 10, rnd(150, 260), 'Shifts'); add(src[4], 24, rnd(120, 240), 'Shifts');
    if(Math.random() > .35) add(src[5], 17, rnd(40, 220), 'Market sales');
    bills.forEach(b => { if((b.dueDay || 1) <= last) expenses.push({ id:uid(), billId:b.id, date:d(b.dueDay || 1), amount:b.amount, category:b.category, personId:b.personId, note:b.name }); });
    const exp = (day, cat, lo, hi, who, note) => { if(day <= last) expenses.push({ id:uid(), date:d(day), amount:rnd(lo, hi), category:cat, personId:who, note }); };
    [4, 11, 18, 25].forEach(day => exp(day, 'Groceries', 90, 170, 'shared', 'Grocery run'));
    [7, 21].forEach(day => exp(day, 'Gas & transport', 35, 60, p1, 'Gas'));
    [9, 26].forEach(day => exp(day, 'Gas & transport', 30, 55, p2, 'Gas'));
    [6, 13, 27].forEach(day => exp(day, 'Dining out', 25, 85, Math.random() > .5 ? p1 : p2, 'Dinner'));
    exp(16, 'Pets', 30, 70, 'shared', 'Cat food & litter');
    exp(14, 'Household', 20, 90, 'shared', 'Target');
    exp(23, 'Entertainment', 15, 80, 'shared', 'Movie night');
    if(Math.random() > .5) exp(19, 'Shopping', 30, 160, p2, '');
    if(Math.random() > .6) exp(28, 'Health', 20, 120, p1, 'Pharmacy');
  }
  Object.assign(S, { sources:src, bills, income, expenses });
}

/* =========================================================
   Events
   ========================================================= */
const actions = {
  'prev-month': () => { view.month = addMonths(view.month, -1); renderAll(); },
  'next-month': () => { view.month = addMonths(view.month, 1); renderAll(); },
  'open-settings': () => settingsDialog(false),
  'close-dialog': () => closeDialog(),
  'add-source': b => sourceDialog(null, b.dataset.person),
  'edit-source': b => sourceDialog(S.sources.find(s => s.id === b.dataset.id)),
  'delete-source': b => {
    const id = b.dataset.id, n = S.income.filter(e => e.sourceId === id).length;
    if(!confirm(n ? `Delete this source and its ${n} logged payment${n === 1 ? '' : 's'}? To keep the history, uncheck "Currently bringing in money" instead.` : 'Delete this income source?')) return;
    S.sources = S.sources.filter(s => s.id !== id); S.income = S.income.filter(e => e.sourceId !== id);
    closeDialog(); commit('Source deleted');
  },
  'del-income': b => { S.income = S.income.filter(e => e.id !== b.dataset.id); commit('Entry deleted'); },
  'del-expense': b => { S.expenses = S.expenses.filter(e => e.id !== b.dataset.id); commit('Expense deleted'); },
  'edit-categories': () => categoriesDialog(),
  'add-bill': () => billDialog(null),
  'edit-bill': b => billDialog(S.bills.find(x => x.id === b.dataset.id)),
  'delete-bill': b => {
    if(!confirm('Delete this bill? Payments you already marked stay in your expenses.')) return;
    S.expenses.forEach(e => { if(e.billId === b.dataset.id) delete e.billId; });
    S.bills = S.bills.filter(x => x.id !== b.dataset.id); closeDialog(); commit('Bill deleted');
  },
  'toggle-bill': b => {
    const bill = S.bills.find(x => x.id === b.dataset.id), m = view.month, paid = billPayment(bill.id, m);
    if(paid){ S.expenses = S.expenses.filter(e => e !== paid); commit(`${bill.name} unmarked`); return; }
    const amount = (bill.frequency === 'weekly' || bill.frequency === 'biweekly') ? Math.round(billMonthly(bill) * 100) / 100 : bill.amount;
    const day = Math.min(bill.dueDay || 1, daysIn(m));
    S.expenses.push({ id:uid(), billId:bill.id, date:`${m}-${pad(day)}`, amount, category:bill.category, personId:bill.personId, note:bill.name });
    commit(`${bill.name} marked paid`);
  },
  'export': () => {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `household-budget-backup-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  'import': () => $('#import-file').click(),
  'sign-in': () => signInDialog(),
  'sign-out': () => { Cloud.signOut().then(() => { setSyncPill(''); S = normalize(Store.load()); closeDialog(); renderAll(); toast('Signed out'); }); },
  'reset': () => {
    if(!confirm('Erase all income, expenses, bills, and names? This can’t be undone unless you have a backup.')) return;
    S = defaultState(); S.onboarded = true; closeDialog(); commit('Everything erased');
  }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]'); if(t && actions[t.dataset.action]){ e.preventDefault(); actions[t.dataset.action](t, e); return; }
  const tab = e.target.closest('.tab'); if(tab){ view.tab = tab.dataset.tab; renderAll(); }
});
document.addEventListener('keydown', e => {
  if(!e.target.classList.contains('tab') || !['ArrowLeft','ArrowRight'].includes(e.key)) return;
  const tabs = [...document.querySelectorAll('.tab')], i = tabs.indexOf(e.target);
  const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
  view.tab = next.dataset.tab; renderAll(); next.focus();
});
document.addEventListener('submit', e => {
  const f = e.target, kind = f.dataset.form; if(!kind) return;
  e.preventDefault();
  const fd = new FormData(f), amount = num(fd.get('amount')), date = fd.get('date');
  if(isNaN(amount) || amount <= 0){ toast('Enter an amount greater than zero.'); return; }
  if(!date){ toast('Pick a date.'); return; }
  if(kind === 'log-income'){
    S.income.push({ id:uid(), sourceId:fd.get('sourceId'), date, amount, note:String(fd.get('note') || '').trim() });
    const keep = fd.get('sourceId'); commit('Income logged');
    const sel = $('#li-src'); if(sel) sel.value = keep; $('#li-amt')?.focus();
  } else if(kind === 'log-expense'){
    const cat = fd.get('category'), who = fd.get('personId');
    S.expenses.push({ id:uid(), date, amount, category:cat, personId:who, note:String(fd.get('note') || '').trim() });
    commit('Expense logged');
    $('#le-cat').value = cat; $('#le-who').value = who; $('#le-amt')?.focus();
  }
  if(ymOf(date) !== view.month) toast(`Logged to ${monthLabel(ymOf(date))}`);
});
$('#import-file').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    if(!data || !Array.isArray(data.people)) throw new Error('bad');
    if(!confirm('Replace your current data with this backup?')) return;
    S = normalize(data); S.onboarded = true; closeDialog(); commit('Backup restored');
  }catch(err){ toast('That file isn’t a budget backup. Choose a .json file you downloaded from this app.'); }
});
window.addEventListener('resize', () => { if(view.tab === 'insights') charts.forEach(c => c.resize()); });

/* ---------- start ---------- */
renderAll();
(async function start(){
  if(Cloud.init()){
    try{
      const user = await Cloud.session();
      if(user){ await connectHousehold(); return; }
      let skipped = false; try{ skipped = !!localStorage.getItem(SKIP_KEY); }catch(e){}
      if(!skipped){ signInDialog(); return; }
    }catch(e){ toast('Sync unavailable right now: ' + e.message); }
  }
  if(!S.onboarded) settingsDialog(true);
})();
</script>
</body>
</html>
